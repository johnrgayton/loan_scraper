services:
  postgres:
    image: postgres:16.2
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  scraper:
    platform: linux/amd64
    build:
      context: .
      args:
        CHROME_VERSION: 147.0.7727.138
        CHROME_VERSION_MAIN: 147
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGSSLMODE: disable
      CHROME_BINARY_PATH: /opt/chrome/chrome-linux64/chrome
      CHROME_VERSION_MAIN: 147
      SCRAPER_HEADLESS: 1
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - scraper

volumes:
  postgres_data:
